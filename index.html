*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5;color:#222;text-align:center}

.rideOpt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}

.bookBtn{background:#00a651;color:white;border:none;padding:15px;width:100%;border-radius:25px;font-weight:bold;font-size:17px;cursor:pointer}
.bookBtn:active{background:#007a3d}
.driver{display:flex;gap:12px;align-items:center;background:#f9f9f9;padding:12px;border-radius:12px;margin:10px 0}
.driver .ava{font-size:45px}
.driver b{color:#00a651}
.progress{height:12px;background:#eee;border-radius:10px;overflow:hidden;margin:12px 0}
#rideBar{height:100%;width:0%;background:#00a651;transition:0.5s}
